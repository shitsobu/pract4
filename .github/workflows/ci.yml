name: Attendance CI/CD

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_PORT: "8106"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
      - run: |
          python --version
          echo "Commit: $GITHUB_SHA"
          python -m compileall -q attendance.py tests
      - name: Check UTF-8 text files
        run: |
          python - <<'PY'
          from pathlib import Path
          extensions={".py",".md",".txt",".csv",".json",".yml",".yaml",".ini",".cfg",".toml",".sh"}
          ignored={".git","__pycache__",".venv","dist","deploy"}
          checked=0
          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in ignored for part in path.parts):
                  continue
              if path.suffix.lower() in extensions or path.name in {".gitignore","Dockerfile"}:
                  path.read_text(encoding="utf-8")
                  checked+=1
          print(f"UTF-8 check passed. Files checked: {checked}")
          PY

  unit_tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
      - run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Create distribution
        run: |
          mkdir -p dist
          cp attendance.py README.md Dockerfile attendance.csv.example dist/
          {
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
            echo "FILES:"
            find dist -maxdepth 1 -type f -printf '%f\\n' | sort
          } > dist/manifest.txt
          cat dist/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: attendance-${{ github.run_id }}
          path: dist/
          retention-days: 7

  deploy_test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: package
    environment:
      name: test/attendance
      url: http://localhost:8106
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: attendance-${{ github.run_id }}
          path: dist
      - name: Check deployment secret
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          test -n "$DEPLOY_TOKEN"
          echo "DEPLOY_TOKEN is configured"
      - name: Deploy and smoke test
        run: |
          mkdir -p deploy/test
          cp -r dist/. deploy/test/
          python attendance.py --help
          python attendance.py --duration 22:30 01:15
          echo "Deployment completed for commit $GITHUB_SHA" > deploy/test/deployment.txt
          cat deploy/test/deployment.txt
